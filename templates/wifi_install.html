
{% extends "base.html" %}
{% block title %}Agiza WiFi{% endblock %}
{% block content %}

<style>
.wi-wrap {
    max-width: 520px;
    margin: auto;
    padding: 14px 14px 90px;
}

.wi-hero {
    background: linear-gradient(135deg, #0f766e, #14b8a6);
    border-radius: 16px;
    padding: 18px;
    color: white;
    margin-bottom: 14px;
    box-shadow: 0 5px 16px rgba(13,148,136,.2);
}

.wi-hero h1 {
    margin: 0;
    font-size: 1.3rem;
    font-weight: 800;
}

.wi-hero p {
    margin: 5px 0 0;
    font-size: .85rem;
}

.wi-card {
    background: white;
    border: 1px solid #e5eeec;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.wi-card label {
    display: block;
    margin: 13px 0 6px;
    font-size: .8rem;
    font-weight: 700;
    color: #334b47;
}

.wi-card label:first-child {
    margin-top: 0;
}

.req {
    color: #dc2626;
}

.wi-card input,
.wi-card textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border: 1px solid #dce7e4;
    border-radius: 11px;
    background: #f7faf9;
    color: #102b27;
    font-size: 16px;
    outline: none;
}

.wi-card input:focus,
.wi-card textarea:focus {
    border-color: #14b8a6;
    box-shadow: 0 0 0 3px rgba(20,184,166,.12);
}

.wi-grid2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.wi-error {
    display: none;
    color: #dc2626;
    font-size: .78rem;
    margin-top: 5px;
    font-weight: 600;
}

.wi-card button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #0f766e, #14b8a6);
    color: white;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
}

.wi-card button:active {
    transform: scale(.98);
}

@media(max-width:360px) {
    .wi-grid2 {
        grid-template-columns: 1fr;
        gap: 0;
    }
}
</style>

<div class="wi-wrap">

    <div class="wi-hero">
        <h1>Agiza WiFi</h1>
        <p>Jaza taarifa zako za ufungaji wa WiFi.</p>
    </div>

    <form method="POST" class="wi-card" autocomplete="on" id="wifiForm">

        <label for="full_name">Majina Matatu <span class="req">*</span></label>
        <input id="full_name" name="full_name" type="text"
               required placeholder="Majina yako matatu">

        <label for="nida_number">Namba ya NIDA <span class="req">*</span></label>
        <input id="nida_number" name="nida_number"
               type="text" required
               inputmode="numeric"
               maxlength="20"
               minlength="20"
               placeholder="Namba ya NIDA (tarakimu 20)">

        <div class="wi-error" id="nidaError">
            Enter valid NIDA number
        </div>

        <label for="email">Barua Pepe <span class="req">*</span></label>
        <input id="email" name="email" type="email"
               required placeholder="example@gmail.com"
               value="{{ current_user.email if current_user and current_user.email else '' }}">

        <label for="phone">Namba ya Simu <span class="req">*</span></label>
        <input id="phone" name="phone" type="tel"
               required placeholder="07XXXXXXXX"
               value="{{ current_user.phone if current_user and current_user.phone else '' }}">

        <label for="install_location">Anwani ya Ufungaji <span class="req">*</span></label>
        <textarea id="install_location" name="install_location"
                  rows="2" required placeholder="Eleza eneo la ufungaji"></textarea>

        <div class="wi-grid2">
            <div>
                <label for="region">Mkoa <span class="req">*</span></label>
                <input id="region" name="region" required
                       placeholder="Mkoa">
            </div>

            <div>
                <label for="district">Wilaya <span class="req">*</span></label>
                <input id="district" name="district" required
                       placeholder="Wilaya">
            </div>
        </div>

        <div class="wi-grid2">
            <div>
                <label for="ward">Kata <span class="req">*</span></label>
                <input id="ward" name="ward" required
                       placeholder="Kata">
            </div>

            <div>
                <label for="village">Kijiji / Mtaa <span class="req">*</span></label>
                <input id="village" name="village" required
                       placeholder="Kijiji / Mtaa">
            </div>
        </div>

        <button type="submit">Tuma Ombi</button>

    </form>
</div>

<script>
const nidaInput = document.getElementById("nida_number");
const nidaError = document.getElementById("nidaError");
const wifiForm = document.getElementById("wifiForm");

function validateNida() {
    const nida = nidaInput.value.trim();

    const valid = /^\d{20}$/.test(nida) &&
                  Number(nida.substring(0, 4)) >= 1930 &&
                  Number(nida.substring(0, 4)) <= 2025;

    nidaError.style.display = valid ? "none" : "block";
    nidaInput.style.borderColor = valid ? "#14b8a6" : "#dc2626";

    return valid;
}

nidaInput.addEventListener("input", function() {
    this.value = this.value.replace(/\D/g, "").slice(0, 20);

    if (this.value.length === 20) {
        validateNida();
    } else {
        nidaError.style.display = "none";
        nidaInput.style.borderColor = "#dce7e4";
    }
});

wifiForm.addEventListener("submit", function(event) {
    if (!validateNida()) {
        event.preventDefault();
        nidaError.style.display = "block";
        nidaInput.focus();
    }
});
</script>

{% endblock %}
