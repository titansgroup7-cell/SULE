# Build Android APK automatically from GitHub (Capacitor)
# Triggers: push to main, manual "Run workflow"
name: Build Android APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "templates/**"
      - "app.py"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      server_url:
        description: "App server URL (leave empty to use capacitor.config.json)"
        required: false
        default: ""

jobs:
  build:
    name: Capacitor → Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Prepare www (Capacitor webDir)
        run: npm run build:www

      - name: Override server URL (optional)
        if: github.event.inputs.server_url != ''
        run: |
          node -e "
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          c.server = c.server || {};
          c.server.url = process.env.SERVER_URL;
          fs.writeFileSync('capacitor.config.json', JSON.stringify(c, null, 2));
          console.log('server.url =', c.server.url);
          "
        env:
          SERVER_URL: ${{ github.event.inputs.server_url }}

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::Secret GOOGLE_SERVICES_JSON haijawekwa — push (FCM) haitafanya kazi kwenye APK hii."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "google-services.json written"

      - name: Ensure Google Services plugin
        run: |
          # Root build.gradle — classpath
          if ! grep -q "com.google.gms:google-services" android/build.gradle 2>/dev/null; then
            sed -i "s/dependencies {/dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'/" android/build.gradle || true
          fi
          # App build.gradle — apply plugin
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle 2>/dev/null; then
            echo "" >> android/app/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        id: apk
        run: |
          APK=$(find android -name "*.apk" -path "*/debug/*" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sule-business-debug
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # --- Optional signed release (needs secrets) ---
      - name: Decode keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build signed release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            --no-daemon --stacktrace

      - name: Upload release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sule-business-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
