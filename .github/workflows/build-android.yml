# Build Android APK automatically from GitHub (Capacitor)
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      server_url:
        description: "App server URL (leave empty to use capacitor.config.json)"
        required: false
        default: ""

jobs:
  build:
    name: Capacitor to Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Prepare www
        run: npm run build:www

      - name: Override server URL
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.server_url != ''
        run: |
          node -e "
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          c.server = c.server || {};
          c.server.url = process.env.SERVER_URL;
          fs.writeFileSync('capacitor.config.json', JSON.stringify(c, null, 2));
          console.log('server.url =', c.server.url);
          "
        env:
          SERVER_URL: ${{ github.event.inputs.server_url }}

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::Secret GOOGLE_SERVICES_JSON not set — FCM push may not work."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "google-services.json written"

      - name: Ensure Google Services plugin
        run: |
          if [ -f android/build.gradle ] && ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i "s/dependencies {/dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'/" android/build.gradle || true
          fi
          if [ -f android/app/build.gradle ] && ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        id: apk
        run: |
          APK=$(find android -name "*.apk" -path "*/debug/*" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sule-business-debug
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
